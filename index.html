<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>G BUILD GAME - Level 1</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#87ceeb;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

#topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:20;
    background:#0b6b3a;
    color:white;
    padding:10px;
    text-align:center;
    font-weight:bold;
}

#topbar h2{
    margin:0;
    font-size:20px;
}

#progressBox{
    margin-top:7px;
    height:12px;
    background:#ffffff55;
    border-radius:10px;
    overflow:hidden;
}

#progress{
    width:0%;
    height:100%;
    background:#ffd700;
    transition:.3s;
}

#progressText{
    font-size:12px;
    margin-top:3px;
}

#tools{
    position:fixed;
    z-index:20;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    width:96%;
    max-width:700px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
}

.tool{
    border:0;
    border-radius:10px;
    padding:10px 4px;
    background:white;
    font-weight:bold;
    font-size:12px;
    box-shadow:0 2px 6px #0005;
}

.tool:active{
    transform:scale(.94);
}

.tool.active{
    background:#0b6b3a;
    color:white;
}

#message{
    position:fixed;
    z-index:25;
    top:95px;
    left:50%;
    transform:translateX(-50%);
    background:#000b;
    color:white;
    padding:10px 15px;
    border-radius:20px;
    font-size:14px;
    text-align:center;
    max-width:90%;
}

#reset{
    position:fixed;
    right:10px;
    top:10px;
    z-index:30;
    border:0;
    border-radius:8px;
    padding:7px 10px;
    background:#d9534f;
    color:white;
    font-weight:bold;
}

@media(max-width:500px){

    #tools{
        grid-template-columns:repeat(3,1fr);
    }

    .tool{
        padding:9px 2px;
        font-size:11px;
    }

}

</style>
</head>

<body>

<div id="game"></div>

<div id="topbar">

    <h2>🏗️ G BUILD GAME</h2>

    <div>
        LEVEL 1 — SIMPLE HOUSE
    </div>

    <div id="progressBox">
        <div id="progress"></div>
    </div>

    <div id="progressText">
        0% Complete
    </div>

</div>

<button id="reset"
        onclick="location.reload()">
    RESET
</button>

<div id="message">
    Select a construction tool to begin.
</div>

<div id="tools">

    <button class="tool"
            data-tool="foundation">
        🧱 Foundation
    </button>

    <button class="tool"
            data-tool="blocks">
        🧱 Lay Blocks
    </button>

    <button class="tool"
            data-tool="door">
        🚪 Door
    </button>

    <button class="tool"
            data-tool="window">
        🪟 Window
    </button>

    <button class="tool"
            data-tool="roof">
        🏠 Roof
    </button>

    <button class="tool"
            data-tool="plaster">
        🧱 Plaster
    </button>

    <button class="tool"
            data-tool="ceiling">
        Ceiling
    </button>

    <button class="tool"
            data-tool="tile">
        Tile Floor
    </button>

    <button class="tool"
            data-tool="electrical">
        ⚡ Electrical
    </button>

    <button class="tool"
            data-tool="lighting">
        💡 Lighting
    </button>

    <button class="tool"
            data-tool="inspect">
        🔍 Inspect
    </button>

</div>

<script>

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);


/* CAMERA */

const camera =
    new THREE.PerspectiveCamera(
        55,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );

camera.position.set(
    9,
    7,
    10
);


/* RENDERER */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* LIGHT */

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        1.5
    );

scene.add(ambient);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    10,
    15,
    10
);

scene.add(sun);


/* GROUND */

const ground =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            30,
            0.2,
            30
        ),
        new THREE.MeshStandardMaterial({
            color:0x55aa55
        })
    );

ground.position.y = -0.1;

scene.add(ground);


/* VARIABLES */

let currentTool = "";

let foundationBuilt = false;
let doorBuilt = false;
let windowBuilt = false;
let roofBuilt = false;
let plasterBuilt = false;
let ceilingBuilt = false;
let tilesBuilt = false;
let electricalBuilt = false;
let lightingBuilt = false;

let wallBlocks = [];

let wallRows = 0;

let foundationBlocks = [];


/* HOUSE GROUP */

const house =
    new THREE.Group();

scene.add(house);


/* MESSAGE */

function showMessage(text){

    document
        .getElementById("message")
        .textContent = text;

}
      /* =========================
   FOUNDATION
========================= */

function buildFoundation(){

    if(foundationBuilt){
        showMessage("Foundation already built.");
        return;
    }

    const material =
        new THREE.MeshStandardMaterial({
            color:0x777777
        });

    for(let x=-2.5; x<=2.5; x+=0.5){

        for(let z=-1.5; z<=1.5; z+=0.5){

            const block =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        0.48,
                        0.25,
                        0.48
                    ),
                    material
                );

            block.position.set(
                x,
                0.15,
                z
            );

            house.add(block);

            foundationBlocks.push(block);
        }
    }

    foundationBuilt = true;

    showMessage(
        "✅ Foundation completed. Select Lay Blocks."
    );

    updateProgress();
}


/* =========================
   BRICK MATERIAL
========================= */

const brickMaterial =
    new THREE.MeshStandardMaterial({
        color:0xb85c38
    });


/* =========================
   LAY ONE BRICK
========================= */

function layBrick(){

    if(!foundationBuilt){

        showMessage(
            "⚠️ Build the foundation first."
        );

        return;
    }

    if(wallRows >= 7){

        showMessage(
            "🏠 Walls completed. Add the door and windows."
        );

        return;
    }


    const brick =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.48,
                0.38,
                0.22
            ),
            brickMaterial
        );


    /*
       FRONT WALL
    */

    const x =
        -2.5 +
        (wallBlocks.length % 11) *
        0.5;

    const row =
        Math.floor(
            wallBlocks.length / 11
        );


    brick.position.set(
        x,
        0.45 + row * 0.4,
        -1.5
    );


    house.add(brick);

    wallBlocks.push(brick);


    /*
       BACK WALL
    */

    const backBrick =
        brick.clone();

    backBrick.position.z =
        1.5;

    house.add(backBrick);


    /*
       SIDE WALLS
    */

    if(
        wallBlocks.length % 11 === 0
    ){

        for(let z=-1; z<=1; z+=0.5){

            const left =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        0.22,
                        0.38,
                        0.48
                    ),
                    brickMaterial
                );

            left.position.set(
                -2.5,
                0.45 + row * 0.4,
                z
            );

            house.add(left);


            const right =
                left.clone();

            right.position.x =
                2.5;

            house.add(right);
        }

        wallRows++;
    }


    showMessage(
        "🧱 Brick placed! Keep tapping Lay Blocks."
    );

    updateProgress();
}


/* =========================
   DOOR
========================= */

function buildDoor(){

    if(!foundationBuilt){

        showMessage(
            "Build the foundation first."
        );

        return;
    }

    if(wallRows < 7){

        showMessage(
            "Finish the brick walls first."
        );

        return;
    }

    if(doorBuilt){

        showMessage(
            "Door already installed."
        );

        return;
    }


    const frame =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.0,
                2.1,
                0.18
            ),
            new THREE.MeshStandardMaterial({
                color:0x5b351d
            })
        );


    frame.position.set(
        0,
        1.3,
        -1.62
    );

    house.add(frame);


    doorBuilt = true;

    showMessage(
        "🚪 Door installed successfully."
    );

    updateProgress();
}


/* =========================
   WINDOW
========================= */

function buildWindow(){

    if(!doorBuilt){

        showMessage(
            "Install the door first."
        );

        return;
    }

    if(windowBuilt){

        showMessage(
            "Windows already installed."
        );

        return;
    }


    const glassMaterial =
        new THREE.MeshStandardMaterial({
            color:0x66ccff,
            transparent:true,
            opacity:0.7
        });


    const leftWindow =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.0,
                1.0,
                0.12
            ),
            glassMaterial
        );


    leftWindow.position.set(
        -1.7,
        2.0,
        -1.62
    );

    house.add(leftWindow);


    const rightWindow =
        leftWindow.clone();

    rightWindow.position.x =
        1.7;

    house.add(rightWindow);


    windowBuilt = true;

    showMessage(
        "🪟 Windows installed."
    );

    updateProgress();
}


/* =========================
   ROOF
========================= */

function buildRoof(){

    if(!windowBuilt){

        showMessage(
            "Install the windows first."
        );

        return;
    }

    if(roofBuilt){

        showMessage(
            "Roof already constructed."
        );

        return;
    }


    const roofMaterial =
        new THREE.MeshStandardMaterial({
            color:0x8b4513
        });


    const roofLeft =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.2,
                0.25,
                3.6
            ),
            roofMaterial
        );


    roofLeft.position.set(
        -1.45,
        3.55,
        0
    );

    roofLeft.rotation.z =
        -0.35;

    house.add(roofLeft);


    const roofRight =
        roofLeft.clone();

    roofRight.position.x =
        1.45;

    roofRight.rotation.z =
        0.35;

    house.add(roofRight);


    roofBuilt = true;

    showMessage(
        "🏠 Roof completed. Continue with plaster."
    );

    updateProgress();
}


/* =========================
   PLASTER
========================= */

function buildPlaster(){

    if(!roofBuilt){

        showMessage(
            "Construct the roof first."
        );

        return;
    }

    if(plasterBuilt){

        showMessage(
            "Plaster already completed."
        );

        return;
    }


    const plaster =
        new THREE.MeshStandardMaterial({
            color:0xf0e6d2
        });


    const front =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                5.2,
                2.7,
                0.08
            ),
            plaster
        );

    front.position.set(
        0,
        1.8,
        -1.57
    );

    house.add(front);


    const back =
        front.clone();

    back.position.z =
        1.57;

    house.add(back);


    plasterBuilt = true;

    showMessage(
        "🧱 Plastering completed."
    );

    updateProgress();
}


/* =========================
   TOOL SELECTION
========================= */

document
    .querySelectorAll(".tool")
    .forEach(button => {

        button.addEventListener(
            "click",
            function(){

                const tool =
                    this.dataset.tool;

                document
                    .querySelectorAll(".tool")
                    .forEach(b =>
                        b.classList.remove(
                            "active"
                        )
                    );

                this.classList.add("active");


                if(tool === "foundation")
                    buildFoundation();

                if(tool === "blocks")
                    layBrick();

                if(tool === "door")
                    buildDoor();

                if(tool === "window")
                    buildWindow();

                if(tool === "roof")
                    buildRoof();

                if(tool === "plaster")
                    buildPlaster();

            }
        );

    });
              /* CEILING */

        function buildCeiling(){

            if(wallRows < 7){

                showMessage(
                    "⚠️ Complete the walls first."
                );

                return;

            }

            if(ceilingBuilt){

                showMessage(
                    "Ceiling already completed."
                );

                return;

            }

            const ceilingMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0xf1f1f1
                });

            const ceiling =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        5.8,
                        0.18,
                        4.6
                    ),
                    ceilingMaterial
                );

            ceiling.position.set(
                0,
                3.65,
                0
            );

            scene.add(ceiling);

            ceilingBuilt = true;

            showMessage(
                "✅ Ceiling completed."
            );

            updateProgress();

        }


        /* FLOOR TILES */

        function buildTiles(){

            if(!ceilingBuilt){

                showMessage(
                    "⚠️ Complete the ceiling first."
                );

                return;

            }

            if(tilesBuilt){

                showMessage(
                    "Floor tiles already completed."
                );

                return;

            }

            const tileMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0xd8d8d8
                });

            for(
                let x = -2.5;
                x <= 2.5;
                x += 0.5
            ){

                for(
                    let z = -2;
                    z <= 2;
                    z += 0.5
                ){

                    const tile =
                        new THREE.Mesh(
                            new THREE.BoxGeometry(
                                0.46,
                                0.04,
                                0.46
                            ),
                            tileMaterial
                        );

                    tile.position.set(
                        x,
                        0.08,
                        z
                    );

                    scene.add(tile);

                }

            }

            tilesBuilt = true;

            showMessage(
                "✅ Floor tiles completed."
            );

            updateProgress();

        }


        /* ELECTRICAL SYSTEM */

        function buildElectrical(){

            if(!tilesBuilt){

                showMessage(
                    "⚠️ Complete the floor tiles first."
                );

                return;

            }

            if(electricalBuilt){

                showMessage(
                    "Electrical system already installed."
                );

                return;

            }

            const wireMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0x222222
                });


            /* MAIN ELECTRICAL LINE */

            const mainWire =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        0.08,
                        0.08,
                        4
                    ),
                    wireMaterial
                );

            mainWire.position.set(
                0,
                3.45,
                0
            );

            scene.add(mainWire);


            /* SIDE LINE */

            const sideWire =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        4.8,
                        0.08,
                        0.08
                    ),
                    wireMaterial
                );

            sideWire.position.set(
                0,
                3.45,
                0
            );

            scene.add(sideWire);


            electricalBuilt = true;

            showMessage(
                "⚡ Electrical system installed."
            );

            updateProgress();

        }


        /* LIGHTING */

        function buildLighting(){

            if(!electricalBuilt){

                showMessage(
                    "⚠️ Install electrical system first."
                );

                return;

            }

            if(lightingBuilt){

                showMessage(
                    "Lighting already installed."
                );

                return;

            }

            const lightMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0xffff99,
                    emissive: 0xffff33,
                    emissiveIntensity: 1
                });


            const light =
                new THREE.Mesh(
                    new THREE.SphereGeometry(
                        0.18,
                        16,
                        16
                    ),
                    lightMaterial
                );

            light.position.set(
                0,
                3.3,
                0
            );

            scene.add(light);


            const lamp =
                new THREE.PointLight(
                    0xffffff,
                    2,
                    10
                );

            lamp.position.set(
                0,
                3.1,
                0
            );

            scene.add(lamp);


            lightingBuilt = true;

            showMessage(
                "💡 Lighting installed."
            );

            updateProgress();

        }


        /* INSPECTION */

        function inspectBuilding(){

            if(!foundationBuilt){

                showMessage(
                    "❌ Inspection failed: foundation missing."
                );

                return;

            }

            if(wallRows < 7){

                showMessage(
                    "❌ Inspection failed: walls incomplete."
                );

                return;

            }

            if(!doorBuilt){

                showMessage(
                    "❌ Inspection failed: door missing."
                );

                return;

            }

            if(!windowBuilt){

                showMessage(
                    "❌ Inspection failed: windows missing."
                );

                return;

            }

            if(!roofBuilt){

                showMessage(
                    "❌ Inspection failed: roof missing."
                );

                return;

            }

            if(!plasterBuilt){

                showMessage(
                    "❌ Inspection failed: plaster incomplete."
                );

                return;

            }

            if(!ceilingBuilt){

                showMessage(
                    "❌ Inspection failed: ceiling missing."
                );

                return;

            }

            if(!tilesBuilt){

                showMessage(
                    "❌ Inspection failed: floor tiles missing."
                );

                return;

            }

            if(!electricalBuilt){

                showMessage(
                    "❌ Inspection failed: electrical system missing."
                );

                return;

            }

            if(!lightingBuilt){

                showMessage(
                    "❌ Inspection failed: lighting missing."
                );

                return;

            }


            showMessage(
                "🏆 BUILDING PASSED INSPECTION! HOUSE COMPLETE!"
            );

            document.getElementById(
                "progress"
            ).textContent =
                "100% COMPLETE 🏆";

        }


        /* PROGRESS */

        function updateProgress(){

            let completed = 0;

            if(foundationBuilt)
                completed++;

            if(wallRows >= 7)
                completed++;

            if(doorBuilt)
                completed++;

            if(windowBuilt)
                completed++;

            if(roofBuilt)
                completed++;

            if(plasterBuilt)
                completed++;

            if(ceilingBuilt)
                completed++;

            if(tilesBuilt)
                completed++;

            if(electricalBuilt)
                completed++;

            if(lightingBuilt)
                completed++;


            const percent =
                Math.round(
                    (completed / 10) * 100
                );

            document.getElementById(
                "progress"
            ).textContent =
                percent + "% COMPLETE";

        }


        /* ANIMATION */

        function animate(){

            requestAnimationFrame(
                animate
            );

            renderer.render(
                scene,
                camera
            );

        }

        animate();


        /* SCREEN RESIZE */

        window.addEventListener(
            "resize",
            function(){

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );

    </script>

</body>
</html>
