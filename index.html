<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>G BUILD GAME — Level 1</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#87ceeb;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

#top{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:rgba(0,0,0,.78);
    color:white;
    padding:10px;
    text-align:center;
    z-index:10;
}

#top h1{
    font-size:22px;
}

#top p{
    font-size:13px;
    margin-top:4px;
}

#instruction{
    position:fixed;
    top:72px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:500px;
    background:white;
    padding:10px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    z-index:10;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
}

#controls{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    width:95%;
    max-width:500px;
    display:flex;
    gap:8px;
    justify-content:center;
    z-index:20;
}

button{
    border:none;
    border-radius:12px;
    padding:14px 12px;
    font-size:15px;
    font-weight:bold;
    background:#087f3f;
    color:white;
    box-shadow:0 3px 8px rgba(0,0,0,.3);
}

button:active{
    transform:scale(.96);
}

#buildBtn{
    flex:1;
}

#rotateBtn{
    background:#1565c0;
}

#resetBtn{
    background:#b71c1c;
}

#message{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:85%;
    max-width:400px;
    background:white;
    padding:25px;
    border-radius:18px;
    text-align:center;
    z-index:50;
    display:none;
    box-shadow:0 5px 25px rgba(0,0,0,.4);
}

#message h2{
    margin-bottom:10px;
}

#message button{
    margin-top:15px;
}

#stage{
    position:fixed;
    right:10px;
    top:10px;
    background:#fff;
    color:#111;
    padding:7px 10px;
    border-radius:10px;
    font-weight:bold;
    z-index:30;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="top">
    <h1>🏗️ G BUILD GAME</h1>
    <p>LEVEL 1 — 🏠 SIMPLE HOUSE</p>
</div>

<div id="stage">Stage 1 / 6</div>

<div id="instruction">
    Tap BUILD to place the foundation.
</div>

<div id="controls">
    <button id="buildBtn">🧱 BUILD</button>
    <button id="rotateBtn">🔄 ROTATE</button>
    <button id="resetBtn">↻ RESET</button>
</div>

<div id="message">
    <h2>🎉 HOUSE COMPLETED!</h2>
    <p>
        Excellent work! You successfully constructed
        the Level 1 simple house.
    </p>
    <button onclick="location.reload()">PLAY AGAIN</button>
</div>

<script>

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);


/* CAMERA */

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(14,11,18);
camera.lookAt(0,3,0);


/* RENDERER */

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

document.getElementById("game").appendChild(renderer.domElement);


/* LIGHT */

const ambient = new THREE.AmbientLight(
    0xffffff,
    1.4
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(10,20,10);

scene.add(sun);


/* GROUND */

const groundGeometry =
    new THREE.BoxGeometry(30,.5,30);

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color:0x3d9b35
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.position.y=-.25;

scene.add(ground);


/* BUILDING GROUP */

const building = new THREE.Group();

scene.add(building);


/* MATERIALS */

const foundationMat =
    new THREE.MeshStandardMaterial({
        color:0x777777
    });

const wallMat =
    new THREE.MeshStandardMaterial({
        color:0xd79b61
    });

const doorMat =
    new THREE.MeshStandardMaterial({
        color:0x5a321f
    });

const windowMat =
    new THREE.MeshStandardMaterial({
        color:0x4fc3f7,
        metalness:.2,
        roughness:.2
    });

const roofMat =
    new THREE.MeshStandardMaterial({
        color:0x8b2020
    });


/* BUILDING PIECES */

function box(
    width,
    height,
    depth,
    material,
    x,
    y,
    z
){

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(x,y,z);

    mesh.visible=false;

    building.add(mesh);

    return mesh;
}


/* FOUNDATION */

const foundation =
    box(
        8,
        .6,
        6,
        foundationMat,
        0,
        .3,
        0
    );


/* WALLS */

const backWall =
    box(
        8,
        4,
        .4,
        wallMat,
        0,
        2.3,
        -2.8
    );

const frontWall =
    box(
        8,
        4,
        .4,
        wallMat,
        0,
        2.3,
        2.8
    );

const leftWall =
    box(
        .4,
        4,
        5.2,
        wallMat,
        -3.8,
        2.3,
        0
    );

const rightWall =
    box(
        .4,
        4,
        5.2,
        wallMat,
        3.8,
        2.3,
        0
    );


/* DOOR */

const door =
    box(
        1.4,
        2.5,
        .15,
        doorMat,
        0,
        1.55,
        2.55
    );


/* WINDOWS */

const window1 =
    box(
        1.5,
        1.3,
        .12,
        windowMat,
        -2.2,
        2.3,
        2.55
    );

const window2 =
    box(
        1.5,
        1.3,
        .12,
        windowMat,
        2.2,
        2.3,
        2.55
    );


/* ROOF */

const roof =
    box(
        9,
        .5,
        7,
        roofMat,
        0,
        4.55,
        0
    );


/* STAGES */

const stages = [

    {
        text:
        "Foundation required. Tap BUILD to place it.",
        piece:foundation
    },

    {
        text:
        "Now construct the four walls.",
        pieces:[
            backWall,
            frontWall,
            leftWall,
            rightWall
        ]
    },

    {
        text:
        "Place the main entrance door.",
        piece:door
    },

    {
        text:
        "Place the two front windows.",
        pieces:[
            window1,
            window2
        ]
    },

    {
        text:
        "Place the roof.",
        piece:roof
    },

    {
        text:
        "Final inspection of the house.",
        final:true
    }

];


let currentStage = 0;

let rotation = 0;

let started = false;


/* UI */

const buildBtn =
    document.getElementById("buildBtn");

const rotateBtn =
    document.getElementById("rotateBtn");

const resetBtn =
    document.getElementById("resetBtn");

const instruction =
    document.getElementById("instruction");

const stageDisplay =
    document.getElementById("stage");

const message =
    document.getElementById("message");


/* UPDATE UI */

function updateUI(){

    stageDisplay.textContent =
        "Stage " +
        (currentStage + 1) +
        " / " +
        stages.length;

    instruction.textContent =
        stages[currentStage].text;

}


/* START / BUILD */

buildBtn.addEventListener(
    "click",
    function(){

        started=true;

        const stage =
            stages[currentStage];


        if(stage.piece){

            stage.piece.visible=true;

        }


        if(stage.pieces){

            stage.pieces.forEach(
                piece=>{
                    piece.visible=true;
                }
            );

        }


        if(stage.final){

            checkBuilding();

            return;

        }


        currentStage++;


        if(currentStage >= stages.length){

            checkBuilding();

            return;

        }


        updateUI();

    }
);


/* ROTATE */

rotateBtn.addEventListener(
    "click",
    function(){

        rotation += Math.PI / 8;

        building.rotation.y =
            rotation;

    }
);


/* RESET */

resetBtn.addEventListener(
    "click",
    function(){

        location.reload();

    }
);


/* FINAL CHECK */

function checkBuilding(){

    const requiredPieces = [

        foundation,
        backWall,
        frontWall,
        leftWall,
        rightWall,
        door,
        window1,
        window2,
        roof

    ];


    const completed =
        requiredPieces.every(
            piece => piece.visible
        );


    if(completed){

        message.style.display="block";

        instruction.textContent =
            "✅ All building standards have been met.";

        buildBtn.disabled=true;

    }

}


/* ANIMATION */

function animate(){

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );

}

animate();


/* RESIZE */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


updateUI();

</script>

</body>
</html>
