<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G Build Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #87ceeb;
}

#game {
    width: 100vw;
    height: 100vh;
    display: block;
}

#title {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    background: rgba(0,0,0,.7);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 20px;
    font-weight: bold;
    z-index: 10;
    white-space: nowrap;
}

#level {
    position: fixed;
    top: 65px;
    left: 15px;
    color: white;
    background: rgba(0,0,0,.7);
    padding: 10px;
    border-radius: 10px;
    z-index: 10;
}

#instructions {
    position: fixed;
    bottom: 85px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 450px;
    text-align: center;
    color: white;
    background: rgba(0,0,0,.7);
    padding: 12px;
    border-radius: 12px;
    z-index: 10;
}

#buildButton {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    border: none;
    border-radius: 30px;
    padding: 15px 30px;
    background: #1687ff;
    color: white;
    font-size: 18px;
    font-weight: bold;
    z-index: 10;
}

#buildButton:active {
    transform: translateX(-50%) scale(.95);
}
</style>
</head>

<body>

<div id="title">🏗️ G BUILD GAME</div>

<div id="level">
Level 1<br>
Simple House
</div>

<div id="instructions">
Build your first house.<br>
Start by laying the foundation.
</div>

<button id="buildButton">
BUILD FOUNDATION
</button>

<canvas id="game"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);


/* =========================
   CAMERA
========================= */

const camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );

camera.position.set(
    10,
    8,
    12
);

camera.lookAt(
    0,
    1,
    0
);


/* =========================
   LIGHT
========================= */

const light =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

light.position.set(
    10,
    15,
    10
);

scene.add(light);

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        0.7
    )
);


/* =========================
   GROUND
========================= */

const groundGeometry =
    new THREE.BoxGeometry(
        30,
        .3,
        30
    );

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x4caf50
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.position.y = -.15;

scene.add(ground);


/* =========================
   BUILDING SITE
========================= */

const siteGeometry =
    new THREE.BoxGeometry(
        8,
        .15,
        7
    );

const siteMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xc2a679
    });

const site =
    new THREE.Mesh(
        siteGeometry,
        siteMaterial
    );

site.position.y = .08;

scene.add(site);


/* =========================
   BUILDING PARTS
========================= */

let foundation = null;
let walls = [];
let door = null;
let windows = [];
let roof = null;


/* =========================
   BUTTON
========================= */

const buildButton =
    document.getElementById(
        "buildButton"
    );

const instructions =
    document.getElementById(
        "instructions"
    );


/* =========================
   BUILDING STAGE
========================= */

let stage = 0;


/* =========================
   BUILD FUNCTION
========================= */

buildButton.addEventListener(
    "click",
    function() {

        /* FOUNDATION */

        if(stage === 0) {

            const geometry =
                new THREE.BoxGeometry(
                    6,
                    .5,
                    5
                );

            const material =
                new THREE.MeshStandardMaterial({
                    color: 0x777777
                });

            foundation =
                new THREE.Mesh(
                    geometry,
                    material
                );

            foundation.position.y =
                .4;

            scene.add(
                foundation
            );

            stage = 1;

            buildButton.innerText =
                "BUILD WALLS";

            instructions.innerHTML =
                "Excellent! 🧱<br>" +
                "Foundation completed.<br>" +
                "Now build the four walls.";

        }


        /* WALLS */

        else if(stage === 1) {

            const wallMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0xd9a066
                });


            // BACK WALL

            const backWall =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        6,
                        3,
                        .3
                    ),
                    wallMaterial
                );

            backWall.position.set(
                0,
                2.15,
                -2.35
            );

            scene.add(backWall);


            // FRONT WALL

            const frontWall =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        6,
                        3,
                        .3
                    ),
                    wallMaterial
                );

            frontWall.position.set(
                0,
                2.15,
                2.35
            );

            scene.add(frontWall);


            // LEFT WALL

            const leftWall =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .3,
                        3,
                        4.7
                    ),
                    wallMaterial
                );

            leftWall.position.set(
                -2.85,
                2.15,
                0
            );

            scene.add(leftWall);


            // RIGHT WALL

            const rightWall =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .3,
                        3,
                        4.7
                    ),
                    wallMaterial
                );

            rightWall.position.set(
                2.85,
                2.15,
                0
            );

            scene.add(rightWall);

            walls.push(
                backWall,
                frontWall,
                leftWall,
                rightWall
            );


            stage = 2;

            buildButton.innerText =
                "BUILD DOOR";

            instructions.innerHTML =
                "Walls completed! 🧱<br>" +
                "The structure is standing.<br>" +
                "Next: install the door.";

        }


        /* DOOR */

        else if(stage === 2) {

            const doorGeometry =
                new THREE.BoxGeometry(
                    1.2,
                    2.2,
                    .15
                );

            const doorMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0x5a3218
                });

            door =
                new THREE.Mesh(
                    doorGeometry,
                    doorMaterial
                );

            door.position.set(
                0,
                1.45,
                2.5
            );

            scene.add(door);


            stage = 3;

            buildButton.innerText =
                "BUILD WINDOWS";

            instructions.innerHTML =
                "Door installed! 🚪<br>" +
                "Next: install the windows.";

        }


        /* WINDOWS */

        else if(stage === 3) {

            const windowMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0x42a5f5
                });


            const leftWindow =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        1.2,
                        1.2,
                        .12
                    ),
                    windowMaterial
                );

            leftWindow.position.set(
                -1.7,
                2.3,
                2.5
            );

            scene.add(
                leftWindow
            );


            const rightWindow =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        1.2,
                        1.2,
                        .12
                    ),
                    windowMaterial
                );

            rightWindow.position.set(
                1.7,
                2.3,
                2.5
            );

            scene.add(
                rightWindow
            );


            windows.push(
                leftWindow,
                rightWindow
            );


            stage = 4;

            buildButton.innerText =
                "BUILD ROOF";

            instructions.innerHTML =
                "Windows installed! 🪟<br>" +
                "The house is almost complete.<br>" +
                "Next: build the roof.";

        }


        /* ROOF */

        else if(stage === 4) {

            const roofGeometry =
                new THREE.ConeGeometry(
                    4.5,
                    2.5,
                    4
                );

            const roofMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0xb52b2b
                });

            roof =
                new THREE.Mesh(
                    roofGeometry,
                    roofMaterial
                );

            roof.rotation.y =
                Math.PI / 4;

            roof.position.y =
                4.9;

            scene.add(roof);


            stage = 5;

            buildButton.innerHTML = 
                "GO TO LEVEL 2 🚀";

            instructions.innerHTML =
                "🎉 HOUSE COMPLETED! 🎉<br>" +
                "Foundation ✓<br>" +
                "Walls ✓ Door ✓ Windows ✓ Roof ✓";

        }


        /* COMPLETE */

        else if(stage === 5) {
    window.location.href = "level2.html";
        }

    }
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================
   RENDERER
========================= */

const renderer =
    new THREE.WebGLRenderer({
        canvas:
            document.getElementById(
                "game"
            ),
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


/* =========================
   ANIMATION
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>

</body>
</html>
