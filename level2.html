<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Level 2 | G Build Game</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#87ceeb;
}

#gameTitle{
    position:absolute;
    top:10px;
    left:0;
    width:100%;
    text-align:center;
    color:white;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 4px #000;
    z-index:10;
}

#info{
    position:absolute;
    top:50px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:500px;
    background:rgba(0,0,0,.65);
    color:white;
    padding:12px;
    border-radius:10px;
    text-align:center;
    z-index:10;
}

#buildButton{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    padding:15px 25px;
    border:none;
    border-radius:10px;
    background:#0b6b3a;
    color:white;
    font-size:17px;
    font-weight:bold;
    z-index:10;
}

#buildButton:disabled{
    background:#777;
}

#backButton{
    position:absolute;
    top:10px;
    left:10px;
    z-index:11;
    padding:8px 12px;
    border:none;
    border-radius:8px;
    background:white;
    color:#222;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="gameTitle">🏗️ G BUILD GAME</div>

<button id="backButton" onclick="location.href='index.html'">
⬅ Back
</button>

<div id="info">
    <b>LEVEL 2: TWO-STOREY BUILDING</b>
    <br>
    <span id="instruction">
        Standard 1: Build the foundation first.
    </span>
</div>

<button id="buildButton">
    BUILD FOUNDATION
</button>

<script>

let scene;
let camera;
let renderer;

let building = new THREE.Group();

let stage = 0;

scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);


// CAMERA
camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(11,9,13);
camera.lookAt(0,3,0);


// LIGHT
const ambientLight = new THREE.AmbientLight(
    0xffffff,
    0.7
);

scene.add(ambientLight);

const directionalLight =
    new THREE.DirectionalLight(
        0xffffff,
        1
    );

directionalLight.position.set(
    10,
    15,
    10
);

scene.add(directionalLight);


// GROUND
const groundGeometry =
    new THREE.BoxGeometry(30,0.2,30);

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color:0x3a9d23
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.position.y=-0.1;

scene.add(ground);


// BUILDING GROUP
scene.add(building);


// HELPER FUNCTION
function addBox(
    width,
    height,
    depth,
    x,
    y,
    z,
    color
){

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:color
        });

    const box =
        new THREE.Mesh(
            geometry,
            material
        );

    box.position.set(
        x,
        y,
        z
    );

    building.add(box);

    return box;
}


// BUILD BUTTON
document
.getElementById("buildButton")
.addEventListener(
    "click",
    buildNext
);


function buildNext(){

    const button =
        document.getElementById(
            "buildButton"
        );

    const instruction =
        document.getElementById(
            "instruction"
        );


    // STAGE 0
    // FOUNDATION
    if(stage === 0){

        addBox(
            7,
            0.6,
            6,
            0,
            0.3,
            0,
            0x777777
        );

        instruction.innerHTML =
            "Standard 1 completed ✅<br>" +
            "Now build the ground-floor walls.";

        button.innerHTML =
            "BUILD GROUND WALLS";

        stage++;
    }


    // STAGE 1
    // GROUND FLOOR WALLS
    else if(stage === 1){

        // BACK WALL
        addBox(
            7,
            3,
            0.4,
            0,
            2.1,
            -2.8,
            0xd2a679
        );

        // FRONT WALL
        addBox(
            7,
            3,
            0.4,
            0,
            2.1,
            2.8,
            0xd2a679
        );

        // LEFT WALL
        addBox(
            0.4,
            3,
            5.2,
            -3.3,
            2.1,
            0,
            0xc28b61
        );

        // RIGHT WALL
        addBox(
            0.4,
            3,
            5.2,
            3.3,
            2.1,
            0,
            0xc28b61
        );

        instruction.innerHTML =
            "Standard 2 completed ✅<br>" +
            "Ground floor comes before the upper floor.";

        button.innerHTML =
            "BUILD GROUND DOOR";

        stage++;
    }


    // STAGE 2
    // DOOR
    else if(stage === 2){

        addBox(
            1.3,
            2.3,
            0.15,
            0,
            1.55,
            3.02,
            0x5b321d
        );

        instruction.innerHTML =
            "Standard 3 completed ✅<br>" +
            "A main entrance is required.";

        button.innerHTML =
            "BUILD GROUND WINDOWS";

        stage++;
    }


    // STAGE 3
    // GROUND WINDOWS
    else if(stage === 3){

        addBox(
            1.4,
            1.2,
            0.15,
            -2,
            2.1,
            3.02,
            0x4da6ff
        );

        addBox(
            1.4,
            1.2,
            0.15,
            2,
            2.1,
            3.02,
            0x4da6ff
        );

        instruction.innerHTML =
            "Standard 4 completed ✅<br>" +
            "Ground-floor windows installed.";

        button.innerHTML =
            "BUILD STAIRCASE";

        stage++;
    }


    // STAGE 4
    // STAIRCASE
    else if(stage === 4){

        for(
            let i=0;
            i<6;
            i++
        ){

            addBox(
                1.2,
                0.3 + i*0.15,
                2.5,
                -1.8,
                0.75 + i*0.25,
                -0.3 + i*0.45,
                0x8b5a2b
            );

        }

        instruction.innerHTML =
            "Standard 5 completed ✅<br>" +
            "Staircase provides access to the first floor.";

        button.innerHTML =
            "BUILD FIRST FLOOR";

        stage++;
    }


    // STAGE 5
    // FIRST FLOOR WALLS
    else if(stage === 5){

        // BACK WALL
        addBox(
            7,
            3,
            0.4,
            0,
            5.1,
            -2.8,
            0xd2a679
        );

        // FRONT WALL
        addBox(
            7,
            3,
            0.4,
            0,
            5.1,
            2.8,
            0xd2a679
        );

        // LEFT WALL
        addBox(
            0.4,
            3,
            5.2,
            -3.3,
            5.1,
            0,
            0xc28b61
        );

        // RIGHT WALL
        addBox(
            0.4,
            3,
            5.2,
            3.3,
            5.1,
            0,
            0xc28b61
        );

        instruction.innerHTML =
            "Standard 6 completed ✅<br>" +
            "First-floor walls are complete.";

        button.innerHTML =
            "BUILD FIRST-FLOOR WINDOWS";

        stage++;
    }


    // STAGE 6
    // FIRST FLOOR WINDOWS
    else if(stage === 6){

        addBox(
            1.4,
            1.2,
            0.15,
            -2,
            5.1,
            3.02,
            0x4da6ff
        );

        addBox(
            1.4,
            1.2,
            0.15,
            2,
            5.1,
            3.02,
            0x4da6ff
        );

        instruction.innerHTML =
            "Standard 7 completed ✅<br>" +
            "First-floor windows installed.";

        button.innerHTML =
            "BUILD ROOF";

        stage++;
    }


    // STAGE 7
    // ROOF
    else if(stage === 7){

        addBox(
            7.5,
            0.5,
            6.5,
            0,
            6.85,
            0,
            0x9b2c2c
        );

        instruction.innerHTML =
            "Standard 8 completed ✅<br>" +
            "The roof is the final major construction stage.";

        button.innerHTML =
            "INSPECT BUILDING";

        stage++;
    }


    // STAGE 8
    // INSPECTION
    else if(stage === 8){

    instruction.innerHTML =
        "🎉 LEVEL 2 COMPLETE! 🎉<br><br>" +
        "✓ Foundation<br>" +
        "✓ Ground floor<br>" +
        "✓ Door<br>" +
        "✓ Windows<br>" +
        "✓ Staircase<br>" +
        "✓ First floor<br>" +
        "✓ First-floor windows<br>" +
        "✓ Roof";

    button.innerHTML =
        "GO TO LEVEL 3 🚀";

    stage++;
    }

}


// RENDERER
renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    window.devicePixelRatio
);

document.body.appendChild(
    renderer.domElement
);


// ANIMATION
function animate(){

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );
}

animate();


// SCREEN RESIZE
window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
  </html>
